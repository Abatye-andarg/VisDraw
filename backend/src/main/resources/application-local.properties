# Run from backend/: share the root configuration with Docker Compose.
spring.config.import=file:../.env[.properties]

# Unencrypted connectivity is restricted to the local development profile.
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3307}/visualnotes?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:visualnotes}
